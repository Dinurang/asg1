spring:
  application:
    name: sun-travels
  datasource:
    url: jdbc:h2:file:./data/sun-travels;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
server:
  port: 8080
  error:
    include-message: never
app:
  default-markup: 15
